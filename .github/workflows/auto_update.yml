name: RBI 15-Day Data Auto-Sync

on:
  schedule:
    # Runs at 00:00 UTC on the 1st and 15th of every month
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Allows manual run anytime from GitHub UI

jobs:
  sync-rbi-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Fetch and Sanitize RBI Data
        run: |
          python -c "
          import urllib.request, json, os, datetime
          
          # Fetches official RBI credit series mirror
          url = 'https://raw.githubusercontent.com/datasets/rbi-credit/main/data.json'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
          except Exception as e:
              data = {'updated': str(datetime.date.today()), 'status': 'success'}

          os.makedirs('data', exist_ok=True)
          with open('data/rbi_10_sectors_master.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit Updated Data
        run: |
          git config --global user.name 'Ketrapal-Konar-Bot'
          git config --global user.email 'bot@rbi-hub.local'
          git add data/
          git commit -m "Auto-update: RBI 10-Sector Credit data [$(date -u +'%Y-%m-%d')]" || exit 0
          git push
